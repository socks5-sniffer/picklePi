<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A welcoming Raspberry Pi workshop for kids and adults. Learn Python, build real circuits, and follow your curiosity through 13 guided projects."
    />
    <meta
      name="keywords"
      content="picklePi, Raspberry Pi, Electronics, Education, Python, GPIO, Maker, STEM, Learning"
    />
    <meta name="author" content="socks5-sniffer" />
    <!-- CSP is delivered via HTTP headers only (vite.config.ts for dev/preview,
         vercel.json and public/_headers for production). A meta CSP here would
         intersect with those policies and break Vite's dev-mode HMR injection. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      property="og:title"
      content="picklePi - Raspberry Pi Electronics Lab"
    />
    <meta
      property="og:description"
      content="Small circuits. Big discoveries. Learn Python and electronics at your own pace."
    />
    <meta property="og:type" content="website" />
    <title>picklePi — Your Maker Workshop</title>
    <!-- Runs synchronously before any CSS/JS to prevent a theme flash.
         External (not inline) so production CSP needs no script hash. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
